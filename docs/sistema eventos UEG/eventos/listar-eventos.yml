info:
  name: Listar eventos
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/eventos"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray

settings:
  encodeUrl: true

docs: |-
  Lista todos os eventos. Os dados ficam em memória e somem quando a API reinicia.
