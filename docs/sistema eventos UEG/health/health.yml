info:
  name: Health
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: eq
      value: ok

settings:
  encodeUrl: true

docs: |-
  Verifica se a API está no ar. Responde `ok` em texto puro.
